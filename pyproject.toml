[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "serbia-business-parser"
version = "0.1.0"
description = "Wide-net parser for Serbian B2B businesses across 10 verticals"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "tldextract>=5.1",
    "selenium>=4.20",
    "webdriver-manager>=4.0",
    "python-dotenv>=1.0",
]

[project.scripts]
serbia-parser = "serbia_parser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
